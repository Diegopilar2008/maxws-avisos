name: MAXWS avisos

on:
  schedule:
    - cron: '2-59/5 * * * *'   # a cada 5 minutos (o GitHub às vezes atrasa alguns minutos)
    - cron: '41 4 * * 1'       # toda segunda: mantém o robô ativo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxws-avisos
  cancel-in-progress: false

jobs:
  avisos:
    if: github.event.schedule != '41 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-firebase-admin-13
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - run: node avisos.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}

  manter-ativo:
    # o GitHub desliga robôs de repositórios parados há 60 dias; um registro por semana evita isso
    if: github.event.schedule == '41 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > ativo.txt
          git config user.name "maxws-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ativo.txt
          git commit -m "robô ativo" || exit 0
          git push
